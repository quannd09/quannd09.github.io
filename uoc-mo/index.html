    function generateInviteCode(existingAccounts) {
      const words = ["LOVE", "TIM", "DUYEN", "CHIP", "MEO", "GAU", "BEE"];
      const list = Array.isArray(existingAccounts) ? existingAccounts : [];
      for (let i = 0; i < 50; i++) {
        const prefix = words[Math.floor(Math.random() * words.length)];
        const code = prefix + "-" + Math.floor(100 + Math.random() * 900);
        if (!list.some(a => a.inviteCode === code || a.coupleCode === code)) {
          return code;
        }
      }
      return "LOVE-" + Math.floor(1000 + Math.random() * 9000);
    }

    function enforceAccountIntegrity(rawList) {
      if (!Array.isArray(rawList)) return { list: [], changed: false };
      let changed = false;

      // 1. Purge any fake/remote accounts or invalid entries
      const byUsername = new Map();
      rawList.forEach(acc => {
        if (!acc || !acc.id || !acc.username) {
          changed = true;
          return;
        }
        if (acc.isRemote === true || String(acc.id).startsWith("remote-")) {
          changed = true;
          return;
        }
        const uname = String(acc.username).trim().toLowerCase();
        const existing = byUsername.get(uname);
        if (!existing) {
          byUsername.set(uname, acc);
        } else {
          changed = true;
          const tNew = Number(acc.updatedAt || 0);
          const tOld = Number(existing.updatedAt || 0);
          if (tNew >= tOld) {
            if (!acc.password && existing.password) acc.password = existing.password;
            byUsername.set(uname, acc);
          }
        }
      });

      const validList = Array.from(byUsername.values());
      if (validList.length !== rawList.length) changed = true;

      // 2. Ensure inviteCode & clean up invalid/one-sided matches
      validList.forEach(acc => {
        if (!acc.inviteCode) {
          acc.inviteCode = generateInviteCode(validList);
          changed = true;
        }
        if (!acc.updatedAt) {
          acc.updatedAt = Date.now();
        }
        const isDummyPartner = !acc.partnerId || acc.partnerName === "Em yêu" || acc.partnerName === "Anh yêu";
        const isLegacyFakeRoom = acc.coupleCode && String(acc.coupleCode).toUpperCase().startsWith("PAIR-");
        const partner = acc.partnerId ? validList.find(other => other.id === acc.partnerId && other.id !== acc.id) : null;
        const isMutualMatch = Boolean(
          !isDummyPartner &&
          !isLegacyFakeRoom &&
          acc.isMatched === true &&
          partner &&
          partner.isMatched === true &&
          partner.partnerId === acc.id
        );

        if (!isMutualMatch) {
          if (acc.isMatched || acc.partnerId || acc.partnerName || acc.coupleCode) {
            delete acc.coupleCode;
            delete acc.partnerId;
            delete acc.partnerName;
            delete acc.matchedAt;
            acc.isMatched = false;
            changed = true;
          }
        } else {
          const sharedCode = (acc.coupleCode || partner.coupleCode || partner.inviteCode || acc.inviteCode).toUpperCase();
          const expectedPartnerName = partner.nickname || partner.username;
          if (acc.coupleCode !== sharedCode || acc.partnerName !== expectedPartnerName) {
            acc.coupleCode = sharedCode;
            acc.partnerName = expectedPartnerName;
            changed = true;
          }
          if (acc.outgoingRequestTo) {
            acc.outgoingRequestTo = null;
            changed = true;
          }
        }
      });

      // 3. Validate outgoingRequestTo & synchronize incomingRequests across all accounts
      validList.forEach(acc => {
        if (acc.isMatched) {
          acc.outgoingRequestTo = null;
          acc.incomingRequests = [];
          return;
        }
        if (acc.outgoingRequestTo) {
          const target = validList.find(other =>
            other.id !== acc.id &&
            (other.id === acc.outgoingRequestTo.id ||
             (acc.outgoingRequestTo.username && other.username.toLowerCase() === String(acc.outgoingRequestTo.username).toLowerCase()))
          );
          if (!target || target.isMatched) {
            acc.outgoingRequestTo = null;
            changed = true;
          } else {
            acc.outgoingRequestTo = {
              id: target.id,
              username: target.username,
              nickname: target.nickname || target.username,
              inviteCode: target.inviteCode,
              requestedAt: acc.outgoingRequestTo.requestedAt || new Date().toISOString()
            };
          }
        }
      });

      // Rebuild incomingRequests for every unmatched account from valid outgoingRequestTo pointers
      validList.forEach(acc => {
        if (acc.isMatched) {
          acc.incomingRequests = [];
          return;
        }
        const computedIncoming = validList
          .filter(other => !other.isMatched && other.id !== acc.id && other.outgoingRequestTo && other.outgoingRequestTo.id === acc.id)
          .map(other => ({
            fromId: other.id,
            fromUsername: other.username,
            fromNickname: other.nickname || other.username,
            fromInviteCode: other.inviteCode,
            requestedAt: other.outgoingRequestTo.requestedAt || new Date().toISOString()
          }));
        const prevJson = JSON.stringify(acc.incomingRequests || []);
        const nextJson = JSON.stringify(computedIncoming);
        if (prevJson !== nextJson) {
          acc.incomingRequests = computedIncoming;
          changed = true;
        }
      });

      return { list: validList, changed };
    }

    function loadAccounts() {
      try {
        const raw = localStorage.getItem(STORAGE_USERS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        const { list, changed } = enforceAccountIntegrity(parsed);
        if (changed) {
          localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(list));
        }
        return list;
      } catch { return []; }
    }

    function saveAccounts(list) {
      try {
        const { list: cleanList } = enforceAccountIntegrity(list);
        localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(cleanList));
        return cleanList;
      } catch { return list; }
    }

    function buildCoupleProfileFromUser(user, accounts) {
      if (!user || !user.isMatched || !user.partnerId) return null;
      const all = Array.isArray(accounts) ? accounts : loadAccounts();
      const partner = all.find(a =>
        a.id !== user.id &&
        a.id === user.partnerId &&
        a.isMatched === true &&
        a.partnerId === user.id
      );
      if (!partner) {
        return null;
      }
      const sharedCode = (user.coupleCode || partner.coupleCode || partner.inviteCode || user.inviteCode || "LOVE-100").toUpperCase();
      return {
        coupleCode: sharedCode,
        myRole: user.role || "anh",
        myName: user.nickname || user.username,
        partnerName: partner.nickname || partner.username,
        partnerId: partner.id,
        isMatched: true,
        matchedAt: user.matchedAt || partner.matchedAt || new Date().toISOString()
      };
    }

    function loadInitialCurrentUser() {
      try {
        if (sessionStorage.getItem(SESSION_LOGOUT_KEY) === "true") return null;
        const sessionRaw = sessionStorage.getItem(AUTH_USER_KEY);
        const localRaw = localStorage.getItem(AUTH_USER_KEY);
        const parsed = sessionRaw ? JSON.parse(sessionRaw) : (localRaw ? JSON.parse(localRaw) : null);
        if (!parsed || !parsed.id) return null;
        const accounts = loadAccounts();
        const fresh = accounts.find(a => a.id === parsed.id) || parsed;
        if (!fresh.inviteCode) fresh.inviteCode = generateInviteCode(accounts);
        sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(fresh));
        return fresh;
      } catch { return null; }
    }

    const PRIORITY_OPTIONS = [

      { key: "thich_nha", label: "Thích nha", emoji: "🌷", rank: 2, badgeClass: "bg-rose-950/60 text-rose-300 border-rose-800/60", activeClass: "bg-rose-500/20 text-rose-200 border-rose-500 shadow-[0_0_20px_rgba(244,63,94,0.25)]" },
      { key: "muon_lam", label: "Muốn lắm", emoji: "🥺", rank: 3, badgeClass: "bg-amber-950/60 text-amber-300 border-amber-800/60", activeClass: "bg-rose-500/25 text-rose-100 border-rose-400 shadow-[0_0_24px_rgba(244,63,94,0.3)]" },
      { key: "can_roi", label: "Cần rồi", emoji: "💕", rank: 4, badgeClass: "bg-pink-950/70 text-pink-300 border-pink-700/60", activeClass: "bg-rose-500/30 text-white border-rose-400 shadow-[0_0_25px_rgba(244,63,94,0.35)]" },

    ];

      { key: "bought", label: "Đã mua sẵn sàng", shortLabel: "Đã mua", badgeClass: "bg-rose-950/80 text-rose-300 border-rose-700/70" },
      { key: "gifted", label: "Đã trao tận tay em", shortLabel: "Đã tặng", badgeClass: "bg-emerald-950/80 text-emerald-300 border-emerald-700/70" },

    const INITIAL_WISHES = [
      { id: "w-101", title: "Vòng tay bạc khắc tên hai đứa", category: "qua_doi_lang_man", price: 650000, priority: "muon_lam", product_link: "https://shopee.vn", notes: "Màu bạc sáng nhé anh, cổ tay em 15cm ạ", status: "secret_prep", secret_note: "Đã nhắn tiệm bạc đặt khắc tên, tuần sau lấy", created_at: new Date(Date.now() - 86400000 * 4).toISOString() },
      { id: "w-102", title: "Son kem nhung lì tông hồng đất", category: "my_pham_lam_dep", price: 420000, priority: "can_roi", product_link: "https://shopee.vn", notes: "Màu số 04 Rose Tea nha anh yêu", status: "bought", secret_note: "Đã săn sale về tay, cất trong ngăn kéo bàn làm việc", created_at: new Date(Date.now() - 86400000 * 3).toISOString() },
      { id: "w-103", title: "Tai nghe chụp tai chống ồn màu kem", category: "do_dien_tu", price: 1450000, priority: "phai_co", product_link: "https://shopee.vn", notes: "Bản Bluetooth 5.4 màu Cream nha anh", status: "pending", secret_note: "", created_at: new Date(Date.now() - 86400000 * 2).toISOString() },
      { id: "w-104", title: "Máy massage cổ vai gáy mini", category: "suc_khoe", price: 890000, priority: "thich_nha", product_link: "", notes: "Màu trắng hoặc hồng pastel đều xinh ạ", status: "pending", secret_note: "", created_at: new Date(Date.now() - 86400000 * 1).toISOString() },
      { id: "w-105", title: "Váy lụa đi biển trễ vai", category: "thoi_trang_phu_kien", price: 550000, priority: "uoc_thoi", product_link: "", notes: "Màu hồng phấn, size S nhé anh", status: "pending", secret_note: "", created_at: new Date().toISOString() },
    ];

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadLocalWishes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_WISHES));
          return [...INITIAL_WISHES];
        }
        return JSON.parse(raw);
      } catch {
        return [...INITIAL_WISHES];
      }
    }

    function saveLocalWishes(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function formatVND(amount) {
      return new Intl.NumberFormat("vi-VN").format(Math.round(amount || 0)) + " ₫";
    }

    function formatNumberInput(val) {
      const digits = String(val).replace(/\D/g, "");
      if (!digits) return "";
      return new Intl.NumberFormat("en-US").format(Number(digits));
    }

    function parseNumberInput(str) {
      const digits = String(str).replace(/\D/g, "");
      return digits ? Number(digits) : 0;
    }

    function getPriority(k) { return PRIORITY_OPTIONS.find(p => p.key === k) || PRIORITY_OPTIONS[2]; }
    function getCategory(k) { return CATEGORY_OPTIONS.find(c => c.key === k) || CATEGORY_OPTIONS[0]; }
    function getStatus(k) { return STATUS_OPTIONS.find(s => s.key === (k || "pending")) || STATUS_OPTIONS[0]; }

      luckyPicked: null,
      luckyBudget: 0,
      luckyPriority: "all",
      editingSecretId: null,

      configOpen: false,
      currentUser: loadInitialCurrentUser(),

      authUsername: "",
      authPassword: "",
      authNickname: "",

      authError: "",

      coupleError: "",
      coupleSuccess: "",
      changePinModalOpen: false,

      pinChangeNew: "",
      pinChangeConfirm: "",
      pinChangeError: "",
      pinChangeSuccess: false,
      coupleMode: "join",
      coupleMyName: "",
      couplePartnerName: "",
      coupleRole: "anh",
      coupleCodeInput: "",
      coupleGeneratedCode: "LOVE-" + Math.floor(100 + Math.random() * 900),
      filters: {
        search: "",
        category: "all",
        priority: "all",
        status: "all",
        sort: "priority_desc"
      },
      webhookUrl: localStorage.getItem(WEBHOOK_KEY) || "",
      sbUrl: localStorage.getItem(SUPABASE_URL_KEY) || "",
      sbKey: localStorage.getItem(SUPABASE_ANON_KEY) || "",
      sbClient: null
    };

    function syncCurrentUserFromAccounts() {
      if (!state.currentUser) {
        state.coupleProfile = null;
        return;
      }
      const accounts = loadAccounts();
      const fresh = accounts.find(a => a.id === state.currentUser.id);
      if (fresh) {
        state.currentUser = fresh;
        try {
          sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(fresh));
        } catch {}
      }
      state.coupleProfile = buildCoupleProfileFromUser(state.currentUser, accounts);
      if (state.coupleProfile) {
        try {
          sessionStorage.setItem(COUPLE_STORAGE_KEY, JSON.stringify(state.coupleProfile));
        } catch {}
      } else {
        try {
          sessionStorage.removeItem(COUPLE_STORAGE_KEY);
        } catch {}
      }
    }

    syncCurrentUserFromAccounts();

    const TAB_INSTANCE_ID = "tab-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7);
    const GLOBAL_REGISTRY_TOPIC = "cpl_wlist_reg_uocmo_v5";

    function mergeAccountLists(incomingAccounts) {
      if (!Array.isArray(incomingAccounts) || incomingAccounts.length === 0) return false;
      const currentRaw = localStorage.getItem(STORAGE_USERS_KEY);
      const localList = currentRaw ? JSON.parse(currentRaw) : [];
      const mapById = new Map();

      localList.forEach(acc => {
        if (acc && acc.id && !acc.isRemote && !String(acc.id).startsWith("remote-")) {
          mapById.set(acc.id, acc);
        }
      });

      let updated = false;
      incomingAccounts.forEach(inc => {
        if (!inc || !inc.id || !inc.username || inc.isRemote || String(inc.id).startsWith("remote-")) return;
        let existing = mapById.get(inc.id);
        if (!existing) {
          existing = Array.from(mapById.values()).find(a => a.username.toLowerCase() === String(inc.username).toLowerCase());
        }
        if (!existing) {
          mapById.set(inc.id, { ...inc });
          updated = true;
        } else {
          const incTime = Number(inc.updatedAt || 0);
          const locTime = Number(existing.updatedAt || 0);
          if (incTime >= locTime) {
            const mergedAcc = {
              ...existing,
              ...inc,
              password: inc.password || existing.password
            };
            mapById.set(existing.id, mergedAcc);
            updated = true;
          }
        }
      });

      if (updated) {
        const wasMatched = Boolean(state.coupleProfile && state.coupleProfile.isMatched);
        saveAccounts(Array.from(mapById.values()));
        syncCurrentUserFromAccounts();
        const isNowMatched = Boolean(state.coupleProfile && state.coupleProfile.isMatched);
        if (!wasMatched && isNowMatched && state.coupleProfile) {
          subscribeCloudRoom(state.coupleProfile.coupleCode);
          if (window.confetti) confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        }
        return true;
      }
      return false;
    }

    let syncChannel = null;
    if ("BroadcastChannel" in window) {
      try {
        syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
        syncChannel.onmessage = (event) => {
          const data = event.data;
          if (!data || !data.type) return;
          if (data.type === "WISH_CREATED" && data.payload) {
            const incoming = data.payload;
            if (!state.wishes.some(w => w.id === incoming.id)) {
              state.wishes.unshift(incoming);
              saveLocalWishes(state.wishes);
              render();
            }
          } else if (data.type === "WISH_UPDATED" && data.payload) {
            const incoming = data.payload;
            state.wishes = state.wishes.map(w => w.id === incoming.id ? incoming : w);
            saveLocalWishes(state.wishes);
            render();
          } else if (data.type === "WISH_DELETED" && data.payload) {
            state.wishes = state.wishes.filter(w => w.id !== String(data.payload));
            saveLocalWishes(state.wishes);
            render();
          } else if (data.type === "WISHES_SYNC" && Array.isArray(data.payload)) {
            state.wishes = data.payload;
            saveLocalWishes(state.wishes);
            render();
          } else if (data.type === "ACCOUNTS_UPDATED" || data.type === "COUPLE_SYNC") {
            if (data.payload && Array.isArray(data.payload.accounts)) {
              mergeAccountLists(data.payload.accounts);
            } else {
              syncCurrentUserFromAccounts();
            }
            state.wishes = loadLocalWishes();
            render();
          } else if (data.type === "PIN_UPDATED" && data.payload) {
            state.adminPin = String(data.payload);
            localStorage.setItem(CUSTOM_PIN_KEY, state.adminPin);
            render();
          }
        };
      } catch (e) {}
    }

    function broadcastSync(type, payload) {
      if (syncChannel) {
        try { syncChannel.postMessage({ type, payload }); } catch (e) {}
      }
    }

    // Cloud Relay for Cross-Device, Cross-Window, and Incognito Realtime Sync
    let activeRoomEventSource = null;
    let activeRegistryEventSource = null;

    function getTopicName(prefix, val) {
      const sanitized = String(val || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "_");
      return "cpl_wlist_" + prefix + "_" + (sanitized || "default");
    }

    async function sendCloudMessage(topic, payload) {
      try {
        await fetch("https://ntfy.sh/" + topic, {
          method: "POST",
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Cloud relay send failed:", err);
      }
    }

    async function publishAccountsToCloud(accountsList) {
      const list = Array.isArray(accountsList) ? accountsList : loadAccounts();
      broadcastSync("ACCOUNTS_UPDATED", { accounts: list });
      await sendCloudMessage(GLOBAL_REGISTRY_TOPIC, {
        type: "ACCOUNTS_REGISTRY_SYNC",
        senderTabId: TAB_INSTANCE_ID,
        timestamp: Date.now(),
        accounts: list
      });
    }

    async function pullCloudAccountsNow() {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3000);
        const res = await fetch("https://ntfy.sh/" + GLOBAL_REGISTRY_TOPIC + "/json?poll=1&since=all", {
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) return loadAccounts();
        const text = await res.text();
        const lines = text.trim().split("\n").filter(Boolean);
        lines.forEach(line => {
          try {
            const env = JSON.parse(line);
            if (!env || !env.message) return;
            const msg = JSON.parse(env.message);
            if (msg && msg.type === "ACCOUNTS_REGISTRY_SYNC" && Array.isArray(msg.accounts)) {
              mergeAccountLists(msg.accounts);
            }
          } catch {}
        });
      } catch (e) {
        console.warn("Cloud registry pull skipped:", e);
      }
      return loadAccounts();
    }

    function subscribeGlobalCloudRegistry() {
      if (typeof window === "undefined" || !("EventSource" in window)) return;
      if (activeRegistryEventSource) {
        try { activeRegistryEventSource.close(); } catch {}
        activeRegistryEventSource = null;
      }
      try {
        activeRegistryEventSource = new EventSource("https://ntfy.sh/" + GLOBAL_REGISTRY_TOPIC + "/sse?since=all");
        activeRegistryEventSource.onopen = () => {
          const currentAccounts = loadAccounts();
          if (currentAccounts.length > 0) {
            sendCloudMessage(GLOBAL_REGISTRY_TOPIC, {
              type: "ACCOUNTS_REGISTRY_SYNC",
              senderTabId: TAB_INSTANCE_ID,
              timestamp: Date.now(),
              accounts: currentAccounts
            });
          } else {
            sendCloudMessage(GLOBAL_REGISTRY_TOPIC, {
              type: "REQUEST_REGISTRY_SYNC",
              senderTabId: TAB_INSTANCE_ID
            });
          }
        };
        activeRegistryEventSource.onmessage = (event) => {
          try {
            const parsedEnvelope = JSON.parse(event.data);
            if (!parsedEnvelope || !parsedEnvelope.message) return;
            const msg = JSON.parse(parsedEnvelope.message);
            if (!msg || !msg.type) return;

            if (msg.type === "ACCOUNTS_REGISTRY_SYNC" && Array.isArray(msg.accounts)) {
              const changed = mergeAccountLists(msg.accounts);
              if (changed) render();
            } else if (msg.type === "REQUEST_REGISTRY_SYNC" && msg.senderTabId !== TAB_INSTANCE_ID) {
              const myAccounts = loadAccounts();
              if (myAccounts.length > 0) {
                sendCloudMessage(GLOBAL_REGISTRY_TOPIC, {
                  type: "ACCOUNTS_REGISTRY_SYNC",
                  senderTabId: TAB_INSTANCE_ID,
                  timestamp: Date.now(),
                  accounts: myAccounts
                });
              }
            }
          } catch (e) {}
        };
      } catch (err) {}
    }

    function subscribeCloudRoom(coupleCode) {
      if (!coupleCode || typeof window === "undefined" || !("EventSource" in window)) return;
      const topic = getTopicName("room", coupleCode);
      if (activeRoomEventSource) {
        try { activeRoomEventSource.close(); } catch {}
        activeRoomEventSource = null;
      }
      try {
        activeRoomEventSource = new EventSource("https://ntfy.sh/" + topic + "/sse?since=all");
        activeRoomEventSource.onmessage = (event) => {
          try {
            const parsedEnvelope = JSON.parse(event.data);
            if (!parsedEnvelope || !parsedEnvelope.message) return;
            const msg = JSON.parse(parsedEnvelope.message);
            if (!msg || !msg.type) return;

            if (state.currentUser && msg.senderId === state.currentUser.id) return;

            if (msg.type === "WISH_CREATED" && msg.payload) {
              const incoming = msg.payload;
              if (!state.wishes.some(w => w.id === incoming.id)) {
                state.wishes.unshift(incoming);
                saveLocalWishes(state.wishes);
                render();
              }
            } else if (msg.type === "WISH_UPDATED" && msg.payload) {
              const incoming = msg.payload;
              state.wishes = state.wishes.map(w => w.id === incoming.id ? incoming : w);
              saveLocalWishes(state.wishes);
              render();
            } else if (msg.type === "WISH_DELETED" && msg.payload) {
              state.wishes = state.wishes.filter(w => w.id !== String(msg.payload));
              saveLocalWishes(state.wishes);
              render();
            } else if (msg.type === "WISHES_SYNC" && Array.isArray(msg.payload)) {
              const existingMap = new Map(state.wishes.map(w => [w.id, w]));
              let changed = false;
              msg.payload.forEach(item => {
                if (!existingMap.has(item.id)) {
                  state.wishes.push(item);
                  changed = true;
                }
              });
              if (changed) {
                saveLocalWishes(state.wishes);
                render();
              }
            } else if (msg.type === "PIN_UPDATED" && msg.payload) {
              state.adminPin = String(msg.payload);
              localStorage.setItem(CUSTOM_PIN_KEY, state.adminPin);
              render();
            } else if (msg.type === "ROOM_SYNC_REQUEST" && state.currentUser) {
              sendCloudMessage(topic, {
                type: "WISHES_SYNC",
                senderId: state.currentUser.id,
                payload: state.wishes
              });
            }
          } catch (e) {
            console.warn("Error processing room SSE message:", e);
          }
        };
      } catch (err) {
        console.warn("SSE room subscribe failed:", err);
      }
    }

            <div class="w-full max-w-md rounded-2xl bg-[#150f19] border border-rose-900/60 p-6 shadow-2xl space-y-5">
              <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">💖</span>
                  <div>
                    <h3 class="font-serif text-xl sm:text-2xl font-bold text-white">${state.authTab === 'login' ? 'Đăng Nhập Tài Khoản' : 'Đăng Ký Tài Khoản'}</h3>
                    <p class="text-xs text-zinc-400">${state.authTab === 'login' ? 'Vào không gian ước mơ riêng của hai bạn' : 'Mỗi người một tài khoản để kết nối cùng nhau'}</p>
                  </div>
                </div>
                <button id="btn-close-auth" type="button" class="px-2.5 py-1 rounded-xl bg-zinc-800 text-xs text-zinc-300">✕</button>
              </div>

              <div class="grid grid-cols-2 p-1 rounded-xl bg-[#110b14] border border-zinc-800">
                <button id="btn-auth-tab-login" type="button" class="py-2 text-xs font-semibold rounded-lg ${state.authTab === 'login' ? 'bg-rose-500 text-white' : 'text-zinc-400'}">Đăng nhập</button>
                <button id="btn-auth-tab-register" type="button" class="py-2 text-xs font-semibold rounded-lg ${state.authTab === 'register' ? 'bg-rose-500 text-white' : 'text-zinc-400'}">Tạo tài khoản mới</button>
              </div>

              <form id="auth-form" class="space-y-4">
                <div class="space-y-1">
                  <label class="block text-xs font-semibold text-zinc-300">Tên đăng nhập</label>
                  <input id="inp-auth-username" type="text" value="${escapeHtml(state.authUsername)}" placeholder="Tên đăng nhập" class="w-full rounded-xl bg-[#1d1522] border border-zinc-700 px-3.5 py-2.5 text-sm text-white outline-none focus:border-rose-500" required />
                </div>

                <div class="space-y-1">
                  <label class="block text-xs font-semibold text-zinc-300">Mật khẩu</label>
                  <input id="inp-auth-password" type="password" value="${escapeHtml(state.authPassword)}" placeholder="••••••••" class="w-full rounded-xl bg-[#1d1522] border border-zinc-700 px-3.5 py-2.5 text-sm text-white outline-none focus:border-rose-500" required />
                </div>

                ${state.authTab === 'register' ? `
                  <div class="space-y-1">
                    <label class="block text-xs font-semibold text-zinc-300">Tên hiển thị hoặc Biệt danh</label>
                    <input id="inp-auth-nickname" type="text" value="${escapeHtml(state.authNickname)}" placeholder="Tên hiển thị hoặc Biệt danh" class="w-full rounded-xl bg-[#1d1522] border border-zinc-700 px-3.5 py-2.5 text-sm text-white outline-none focus:border-rose-500" />
                  </div>

                  <div class="space-y-1">
                    <label class="block text-xs font-semibold text-zinc-300">Vai trò của bạn</label>
                    <div class="grid grid-cols-2 gap-2">
                      <button type="button" id="btn-auth-role-anh" class="py-2 px-3 rounded-xl border text-xs font-semibold ${state.authRole === 'anh' ? 'bg-rose-500 text-white border-rose-500' : 'bg-[#1d1522] border-zinc-800 text-zinc-400'}">Anh 👦</button>
                      <button type="button" id="btn-auth-role-em" class="py-2 px-3 rounded-xl border text-xs font-semibold ${state.authRole === 'em' ? 'bg-pink-500 text-white border-pink-500' : 'bg-[#1d1522] border-zinc-800 text-zinc-400'}">Em 👧</button>
                    </div>
                  </div>
                ` : ''}

                ${state.authError ? `<div class="rounded-xl bg-rose-950/80 border border-rose-700/70 p-3 text-xs text-rose-200">${escapeHtml(state.authError)}</div>` : ''}

                <div class="pt-2">
                  <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-semibold text-sm shadow-[0_4px_20px_rgba(244,63,94,0.35)] active:scale-[0.98]">
                    ${state.authTab === 'login' ? 'Đăng nhập ngay' : 'Tạo tài khoản và tham gia'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}
      `;

      bindEvents(eligibleLucky);
    }

    function bindEvents(eligibleLucky) {
      const tabEm = document.getElementById("tab-em");
      if (tabEm) tabEm.onclick = () => { state.activeTab = "em"; render(); };

      const tabAnh = document.getElementById("tab-anh");
      if (tabAnh) tabAnh.onclick = () => {
        if (state.isUnlocked) { state.activeTab = "anh"; render(); }
        else { state.pinModalOpen = true; state.pinError = ""; render(); }
      };

      const btnOpenDrawer = document.getElementById("btn-open-drawer");
      if (btnOpenDrawer) btnOpenDrawer.onclick = () => { state.drawerOpen = true; render(); };

      const btnSuccessOpenDrawer = document.getElementById("btn-success-open-drawer");
      if (btnSuccessOpenDrawer) btnSuccessOpenDrawer.onclick = () => { state.drawerOpen = true; render(); };

      const btnCloseDrawer = document.getElementById("btn-close-drawer");
      if (btnCloseDrawer) btnCloseDrawer.onclick = () => { state.drawerOpen = false; state.editingId = null; render(); };

      const inpTitle = document.getElementById("inp-title");
      if (inpTitle) inpTitle.oninput = (e) => { state.form.title = e.target.value; };

      const inpCat = document.getElementById("inp-category");
      if (inpCat) inpCat.onchange = (e) => { state.form.category = e.target.value; };

      const inpPrice = document.getElementById("inp-price");
      if (inpPrice) inpPrice.oninput = (e) => {
        state.form.priceDisplay = formatNumberInput(e.target.value);
        e.target.value = state.form.priceDisplay;
      };

      const inpLink = document.getElementById("inp-link");
      if (inpLink) inpLink.oninput = (e) => { state.form.product_link = e.target.value; };

      const inpNotes = document.getElementById("inp-notes");
      if (inpNotes) inpNotes.oninput = (e) => { state.form.notes = e.target.value; };

      document.querySelectorAll(".btn-priority").forEach(btn => {
        btn.onclick = () => {
          state.form.priority = btn.getAttribute("data-priority");
          render();
        };
      });

      const form = document.getElementById("wish-form");
      if (form) form.onsubmit = async (e) => {
        e.preventDefault();
        if (!state.form.title.trim()) {
          state.form.error = "Em ơi, hãy nhập tên món quà em thích nhé!";
          state.form.success = "";
          render();
          return;
        }
        const newWish = {
          id: crypto.randomUUID ? crypto.randomUUID() : ("w-" + Date.now()),
          title: state.form.title.trim(),
          category: state.form.category,
          price: parseNumberInput(state.form.priceDisplay),
          priority: state.form.priority,
          product_link: state.form.product_link.trim(),
          notes: state.form.notes.trim(),
          status: "pending",
          secret_note: "",
          is_deleted: false,
          created_at: new Date().toISOString(),
          author_id: state.currentUser ? state.currentUser.id : undefined,
          author_name: state.currentUser ? (state.currentUser.nickname || state.currentUser.username) : (state.coupleProfile ? state.coupleProfile.myName : undefined),
          author_role: state.currentUser ? state.currentUser.role : (state.coupleProfile ? state.coupleProfile.myRole : "em"),
          couple_code: state.coupleProfile ? state.coupleProfile.coupleCode : undefined
        };

        if (state.sbClient) {
          const { data } = await state.sbClient.from("wishes").insert([newWish]).select("*").single();
          if (data) Object.assign(newWish, data);
        }

        state.wishes.unshift(newWish);
        saveLocalWishes(state.wishes);
        broadcastSync("WISH_CREATED", newWish);
        if (state.coupleProfile && state.coupleProfile.coupleCode) {
          sendCloudMessage(getTopicName("room", state.coupleProfile.coupleCode), {
            type: "WISH_CREATED",
            senderId: state.currentUser ? state.currentUser.id : undefined,
            payload: newWish
          });
        }
        pushGoogleSheetWebhook("CREATE", newWish);

        state.form.title = "";
        state.form.priceDisplay = "500,000";
        state.form.product_link = "";
        state.form.notes = "";
        state.form.error = "";
        state.form.success = "Đã gửi vào danh sách ước mơ! Anh đã ghi nhớ món quà này rồi nha ♥";
        if (window.confetti) confetti({ particleCount: 55, spread: 65, origin: { y: 0.72 } });
        render();
      };

      // Edit inside drawer
      document.querySelectorAll(".btn-start-edit").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-start-edit");
          const target = state.wishes.find(w => w.id === id);
          if (target) {
            state.editingId = id;
            state.editDraft = {
              title: target.title,
              category: target.category,
              priceDisplay: formatNumberInput(target.price),
              priority: target.priority,
              product_link: target.product_link || "",
              notes: target.notes || ""
            };
            render();
          }
        };
      });

      const btnCancelEdit = document.getElementById("btn-cancel-edit");
      if (btnCancelEdit) btnCancelEdit.onclick = () => { state.editingId = null; state.editDraft = null; render(); };

      const btnSaveEdit = document.getElementById("btn-save-edit");
      if (btnSaveEdit) btnSaveEdit.onclick = async () => {
        const id = state.editingId;
        const target = state.wishes.find(w => w.id === id);
        if (!target) return;
        const titleVal = document.getElementById("ed-title").value.trim();
        if (!titleVal) return;
        target.title = titleVal;
        target.price = parseNumberInput(document.getElementById("ed-price").value);
        target.category = document.getElementById("ed-cat").value;
        target.priority = document.getElementById("ed-pri").value;
        target.product_link = document.getElementById("ed-link").value.trim();
        target.notes = document.getElementById("ed-notes").value.trim();

        saveLocalWishes(state.wishes);
        broadcastSync("WISH_UPDATED", target);
        if (state.coupleProfile && state.coupleProfile.coupleCode) {
          sendCloudMessage(getTopicName("room", state.coupleProfile.coupleCode), {
            type: "WISH_UPDATED",
            senderId: state.currentUser ? state.currentUser.id : undefined,
            payload: target
          });
        }
        if (state.sbClient) {
          await state.sbClient.from("wishes").update({
            title: target.title,
            price: target.price,
            category: target.category,
            priority: target.priority,
            product_link: target.product_link,
            notes: target.notes
          }).eq("id", id);
        }
        pushGoogleSheetWebhook("UPDATE", target);
        state.editingId = null;
        state.editDraft = null;
        render();
      };

      // PIN Modal
      const btnClosePin = document.getElementById("btn-close-pin");
      const btnCancelPin = document.getElementById("btn-cancel-pin");
      if (btnClosePin) btnClosePin.onclick = () => { state.pinModalOpen = false; render(); };
      if (btnCancelPin) btnCancelPin.onclick = () => { state.pinModalOpen = false; render(); };

      const inpPin = document.getElementById("inp-pin");
      if (inpPin) inpPin.oninput = (e) => { state.pinInput = e.target.value; };

      const pinForm = document.getElementById("pin-form");
      if (pinForm) pinForm.onsubmit = (e) => {
        e.preventDefault();
        if (state.pinInput.trim() === state.adminPin) {
          state.isUnlocked = true;
          sessionStorage.setItem(PIN_SESSION_KEY, "true");
          state.pinModalOpen = false;
          state.pinInput = "";
          state.activeTab = "anh";
          render();
        } else {
          state.pinError = "Mã PIN chưa đúng rồi! Khu vực này giữ bí mật bất ngờ cho em nha ♥";
          render();
        }
      };

      const btnLockPin = document.getElementById("btn-lock-pin");
      if (btnLockPin) btnLockPin.onclick = () => {
        state.isUnlocked = false;
        sessionStorage.removeItem(PIN_SESSION_KEY);
        state.activeTab = "em";
        render();
      };

      // Config Panel
      const btnToggleConfig = document.getElementById("btn-toggle-config");
      if (btnToggleConfig) btnToggleConfig.onclick = () => { state.configOpen = !state.configOpen; render(); };
      const btnCloseConfig = document.getElementById("btn-close-config");
      if (btnCloseConfig) btnCloseConfig.onclick = () => { state.configOpen = false; render(); };
      const btnSaveConfig = document.getElementById("btn-save-config");
      if (btnSaveConfig) btnSaveConfig.onclick = () => {
        state.webhookUrl = document.getElementById("inp-webhook").value.trim();
        state.adminPin = document.getElementById("inp-custom-pin").value.trim() || "2410";
        state.sbUrl = document.getElementById("inp-sb-url").value.trim();
        state.sbKey = document.getElementById("inp-sb-key").value.trim();
        localStorage.setItem(WEBHOOK_KEY, state.webhookUrl);
        localStorage.setItem(CUSTOM_PIN_KEY, state.adminPin);
        localStorage.setItem(SUPABASE_URL_KEY, state.sbUrl);
        localStorage.setItem(SUPABASE_ANON_KEY, state.sbKey);
        initSupabaseClient();
        state.configOpen = false;
        render();
      };

      // Filters
      const fltSearch = document.getElementById("flt-search");
      if (fltSearch) fltSearch.oninput = (e) => {
        state.filters.search = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const nextInp = document.getElementById("flt-search");
        if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
      };
      const fltCat = document.getElementById("flt-category");
      if (fltCat) fltCat.onchange = (e) => { state.filters.category = e.target.value; render(); };
      const fltPri = document.getElementById("flt-priority");
      if (fltPri) fltPri.onchange = (e) => { state.filters.priority = e.target.value; render(); };
      const fltSort = document.getElementById("flt-sort");
      if (fltSort) fltSort.onchange = (e) => { state.filters.sort = e.target.value; render(); };

      document.querySelectorAll(".btn-flt-status").forEach(btn => {
        btn.onclick = () => {
          state.filters.status = btn.getAttribute("data-flt-status");
          render();
        };
      });

      // Secret Note
      document.querySelectorAll(".btn-edit-secret").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-edit-secret");
          const item = state.wishes.find(w => w.id === id);
          if (item) {
            state.editingSecretId = id;
            state.secretNoteDraft = item.secret_note || "";
            render();
          }
        };
      });
      const inpSecret = document.getElementById("inp-secret-note");
      if (inpSecret) inpSecret.oninput = (e) => { state.secretNoteDraft = e.target.value; };
      const btnCancelSecret = document.getElementById("btn-cancel-secret");
      if (btnCancelSecret) btnCancelSecret.onclick = () => { state.editingSecretId = null; render(); };
      document.querySelectorAll(".btn-save-secret").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-save-secret");
          const item = state.wishes.find(w => w.id === id);
          if (item) {
            item.secret_note = state.secretNoteDraft.trim();
            saveLocalWishes(state.wishes);
            broadcastSync("WISH_UPDATED", item);
            if (state.coupleProfile && state.coupleProfile.coupleCode) {
              sendCloudMessage(getTopicName("room", state.coupleProfile.coupleCode), {
                type: "WISH_UPDATED",
                senderId: state.currentUser ? state.currentUser.id : undefined,
                payload: item
              });
            }
            if (state.sbClient) {
              await state.sbClient.from("wishes").update({ secret_note: item.secret_note }).eq("id", id);
            }
            pushGoogleSheetWebhook("UPDATE", item);
            state.editingSecretId = null;
            render();
          }
        };
      });

      // Lucky Picker
      const btnOpenLucky = document.getElementById("btn-open-lucky");
      if (btnOpenLucky) btnOpenLucky.onclick = () => { state.luckyModalOpen = true; state.luckyPicked = null; render(); };
      const btnCloseLucky = document.getElementById("btn-close-lucky");
      if (btnCloseLucky) btnCloseLucky.onclick = () => { state.luckyModalOpen = false; render(); };
      const luckyBudget = document.getElementById("lucky-budget");
      if (luckyBudget) luckyBudget.onchange = (e) => { state.luckyBudget = Number(e.target.value); state.luckyPicked = null; render(); };
      const luckyPri = document.getElementById("lucky-priority");
      if (luckyPri) luckyPri.onchange = (e) => { state.luckyPriority = e.target.value; state.luckyPicked = null; render(); };

      const btnSpinLucky = document.getElementById("btn-spin-lucky");
      if (btnSpinLucky) btnSpinLucky.onclick = () => {
        if (!eligibleLucky || eligibleLucky.length === 0 || state.luckySpinning) return;
        state.luckySpinning = true;
        state.luckyPicked = null;
        let ticks = 0;
        const timer = setInterval(() => {
          const rand = eligibleLucky[Math.floor(Math.random() * eligibleLucky.length)];
          state.luckyHighlight = rand.title;
          ticks++;
          render();
          if (ticks >= 14) {
            clearInterval(timer);
            state.luckyPicked = eligibleLucky[Math.floor(Math.random() * eligibleLucky.length)];
            state.luckySpinning = false;
            if (window.confetti) confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
            render();
          }
        }, 80);
      };

      const btnAcceptLucky = document.getElementById("btn-accept-lucky");
      if (btnAcceptLucky) btnAcceptLucky.onclick = async () => {
        if (!state.luckyPicked) return;
        const item = state.wishes.find(w => w.id === state.luckyPicked.id);
        if (item) {
          item.status = "secret_prep";
          saveLocalWishes(state.wishes);
          broadcastSync("WISH_UPDATED", item);
          if (state.sbClient) {
            await state.sbClient.from("wishes").update({ status: "secret_prep" }).eq("id", item.id);
          }
          pushGoogleSheetWebhook("UPDATE", item);
        }
        state.luckyModalOpen = false;
        render();
      };

      // Status & Delete
      document.querySelectorAll(".btn-status").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-id");
          const st = btn.getAttribute("data-status");
          const item = state.wishes.find(w => w.id === id);
          if (item) {
            item.status = st;
            saveLocalWishes(state.wishes);
            broadcastSync("WISH_UPDATED", item);
            if (state.sbClient) {
              await state.sbClient.from("wishes").update({ status: st }).eq("id", id);
            }
            pushGoogleSheetWebhook("UPDATE", item);
            render();
          }
        };
      });

      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-delete-id");
          const target = state.wishes.find(w => w.id === id);
          state.wishes = state.wishes.filter(w => w.id !== id);
          saveLocalWishes(state.wishes);
          broadcastSync("WISH_DELETED", id);
          if (state.coupleProfile && state.coupleProfile.coupleCode) {
            sendCloudMessage(getTopicName("room", state.coupleProfile.coupleCode), {
              type: "WISH_DELETED",
              senderId: state.currentUser ? state.currentUser.id : undefined,
              payload: id
            });
          }
          if (state.sbClient) {
            await state.sbClient.from("wishes").update({ is_deleted: true }).eq("id", id);
          }
          if (target) pushGoogleSheetWebhook("DELETE", target);
          render();
        };
      });

      // Couple Matching Handlers (Strict 2-Way Mutual Consent & Real Account Verification)
      function acceptPairRequest(senderId) {
        if (!state.currentUser) {
          state.coupleError = "Bạn hãy đăng nhập tài khoản trước khi kết đôi nhé.";
          render();
          return;
        }
        const accounts = loadAccounts();
        const myIdx = accounts.findIndex(a => a.id === state.currentUser.id);
        const senderIdx = accounts.findIndex(a => a.id === senderId);

        if (myIdx < 0 || senderIdx < 0) {
          state.coupleError = "Không tìm thấy thông tin tài khoản để xác nhận kết đôi.";
          render();
          return;
        }

        const myAcc = accounts[myIdx];
        const senderAcc = accounts[senderIdx];

        if (myAcc.isMatched && myAcc.partnerId !== senderAcc.id) {
          state.coupleError = "Bạn hiện đã kết đôi với người khác. Hãy hủy kết đôi hiện tại trước nhé.";
          render();
          return;
        }
        if (senderAcc.isMatched && senderAcc.partnerId !== myAcc.id) {
          state.coupleError = "Tài khoản " + (senderAcc.nickname || senderAcc.username) + " hiện đã kết đôi với người khác mất rồi.";
          render();
          return;
        }

        const nowIso = new Date().toISOString();
        const nowMs = Date.now() + 10;
        const sharedCode = (myAcc.inviteCode || senderAcc.inviteCode || generateInviteCode(accounts)).toUpperCase();

        myAcc.coupleCode = sharedCode;
        myAcc.partnerId = senderAcc.id;
        myAcc.partnerName = senderAcc.nickname || senderAcc.username;
        myAcc.isMatched = true;
        myAcc.matchedAt = nowIso;
        myAcc.outgoingRequestTo = null;
        myAcc.incomingRequests = [];
        myAcc.updatedAt = nowMs;

        senderAcc.coupleCode = sharedCode;
        senderAcc.partnerId = myAcc.id;
        senderAcc.partnerName = myAcc.nickname || myAcc.username;
        senderAcc.isMatched = true;
        senderAcc.matchedAt = nowIso;
        senderAcc.outgoingRequestTo = null;
        senderAcc.incomingRequests = [];
        senderAcc.updatedAt = nowMs;

        // Clear any pending requests from other accounts pointing to either partner
        accounts.forEach(acc => {
          if (acc.id !== myAcc.id && acc.id !== senderAcc.id) {
            if (acc.outgoingRequestTo && (acc.outgoingRequestTo.id === myAcc.id || acc.outgoingRequestTo.id === senderAcc.id)) {
              acc.outgoingRequestTo = null;
              acc.updatedAt = nowMs;
            }
          }
        });

        const cleanedAccounts = saveAccounts(accounts);

        // Migrate wishes authored by either partner to the shared couple code
        let wishesChanged = false;
        state.wishes = state.wishes.map(w => {
          if (w.author_id === myAcc.id || w.author_id === senderAcc.id) {
            if (w.couple_code !== sharedCode) {
              wishesChanged = true;
              return { ...w, couple_code: sharedCode };
            }
          }
          return w;
        });
        if (wishesChanged) {
          saveLocalWishes(state.wishes);
          broadcastSync("WISHES_SYNC", state.wishes);
        }

        syncCurrentUserFromAccounts();
        publishAccountsToCloud(cleanedAccounts);
        subscribeCloudRoom(sharedCode);

        sendCloudMessage(getTopicName("room", sharedCode), {
          type: "WISHES_SYNC",
          senderId: myAcc.id,
          payload: state.wishes
        });

        state.coupleCodeInput = "";
        state.coupleError = "";
        state.coupleSuccess = "";
        state.coupleModalOpen = false;
        if (window.confetti) confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        render();
      }

      function declinePairRequest(senderId) {
        if (!state.currentUser) return;
        const accounts = loadAccounts();
        const myAcc = accounts.find(a => a.id === state.currentUser.id);
        const senderAcc = accounts.find(a => a.id === senderId);
        const nowMs = Date.now() + 10;

        if (senderAcc && senderAcc.outgoingRequestTo && senderAcc.outgoingRequestTo.id === state.currentUser.id) {
          senderAcc.outgoingRequestTo = null;
          senderAcc.updatedAt = nowMs;
        }
        if (myAcc) {
          myAcc.incomingRequests = (myAcc.incomingRequests || []).filter(r => r.fromId !== senderId);
          myAcc.updatedAt = nowMs;
        }

        const cleaned = saveAccounts(accounts);
        syncCurrentUserFromAccounts();
        publishAccountsToCloud(cleaned);
        render();
      }

      function cancelOutgoingPairRequest() {
        if (!state.currentUser) return;
        const accounts = loadAccounts();
        const myAcc = accounts.find(a => a.id === state.currentUser.id);
        if (!myAcc) return;
        const nowMs = Date.now() + 10;
        const targetId = myAcc.outgoingRequestTo ? myAcc.outgoingRequestTo.id : null;
        myAcc.outgoingRequestTo = null;
        myAcc.updatedAt = nowMs;

        if (targetId) {
          const targetAcc = accounts.find(a => a.id === targetId);
          if (targetAcc) {
            targetAcc.updatedAt = nowMs;
          }
        }

        const cleaned = saveAccounts(accounts);
        syncCurrentUserFromAccounts();
        publishAccountsToCloud(cleaned);
        state.coupleError = "";
        state.coupleSuccess = "Đã hủy lời mời kết đôi.";
        render();
      }

      function sendPairRequestToPartner(partnerAcc) {
        if (!state.currentUser) {
          state.coupleError = "Bạn hãy đăng nhập hoặc đăng ký tài khoản trước khi kết đôi nhé.";
          render();
          return;
        }
        if (!partnerAcc || partnerAcc.isRemote || String(partnerAcc.id).startsWith("remote-")) {
          state.coupleError = "Tài khoản này không tồn tại trên hệ thống. Vui lòng kiểm tra lại mã hoặc tên đăng nhập!";
          render();
          return;
        }

        const accounts = loadAccounts();
        const myIdx = accounts.findIndex(a => a.id === state.currentUser.id);
        if (myIdx < 0) {
          state.coupleError = "Không tìm thấy tài khoản hiện tại của bạn.";
          render();
          return;
        }
        const myAcc = accounts[myIdx];

        if (partnerAcc.id === myAcc.id) {
          state.coupleError = "Đây là mã kết đôi của chính bạn. Hãy nhập mã của người yêu nhé!";
          render();
          return;
        }

        if (myAcc.isMatched) {
          state.coupleError = "Bạn hiện đã kết đôi rồi. Hãy hủy kết đôi hiện tại nếu muốn kết nối mới nhé!";
          render();
          return;
        }

        const pIdx = accounts.findIndex(a => a.id === partnerAcc.id);
        if (pIdx < 0) {
          state.coupleError = "Tài khoản người yêu không tồn tại trong hệ thống.";
          render();
          return;
        }
        const targetAcc = accounts[pIdx];

        // Strict 1-to-1 Check: Cannot invite someone already paired with another user
        if (targetAcc.isMatched && targetAcc.partnerId !== myAcc.id) {
          state.coupleError = "Tài khoản " + (targetAcc.nickname || targetAcc.username) + " hiện đã kết đôi với người khác rồi!";
          render();
          return;
        }

        // Check if targetAcc ALREADY sent a request to myAcc -> Mutual consent!
        if (targetAcc.outgoingRequestTo && targetAcc.outgoingRequestTo.id === myAcc.id) {
          acceptPairRequest(targetAcc.id);
          return;
        }

        // Prevent sending to multiple people simultaneously
        if (myAcc.outgoingRequestTo && myAcc.outgoingRequestTo.id !== targetAcc.id) {
          state.coupleError = "Bạn đang chờ @" + myAcc.outgoingRequestTo.username + " đồng ý. Hãy hủy lời mời hiện tại trước khi gửi cho người khác nhé!";
          render();
          return;
        }

        const nowIso = new Date().toISOString();
        const nowMs = Date.now() + 10;
        myAcc.outgoingRequestTo = {
          id: targetAcc.id,
          username: targetAcc.username,
          nickname: targetAcc.nickname || targetAcc.username,
          inviteCode: targetAcc.inviteCode,
          requestedAt: nowIso
        };
        myAcc.updatedAt = nowMs;
        targetAcc.updatedAt = nowMs;

        const cleaned = saveAccounts(accounts);
        syncCurrentUserFromAccounts();
        publishAccountsToCloud(cleaned);

        state.coupleCodeInput = "";
        state.coupleError = "";
        state.coupleSuccess = "Đã gửi lời mời kết đôi tới " + (targetAcc.nickname || targetAcc.username) + "! Hãy chờ người ấy bấm Đồng ý nhé 💕";
        render();
      }

      const btnOpenCouple = document.getElementById("btn-open-couple");
      if (btnOpenCouple) btnOpenCouple.onclick = () => {
        state.coupleModalOpen = true;
        state.coupleError = "";
        state.coupleSuccess = "";
        pullCloudAccountsNow().then(() => render());
        render();
      };

      const btnCloseCouple = document.getElementById("btn-close-couple");
      if (btnCloseCouple) btnCloseCouple.onclick = () => {
        state.coupleModalOpen = false;
        state.coupleError = "";
        state.coupleSuccess = "";
        render();
      };

      const btnCopyCode = document.getElementById("btn-copy-code");
      if (btnCopyCode) btnCopyCode.onclick = () => {
        if (state.coupleProfile) {
          navigator.clipboard.writeText(state.coupleProfile.coupleCode);
          btnCopyCode.textContent = "Đã sao chép! ✓";
          setTimeout(() => { if (btnCopyCode) btnCopyCode.textContent = "Sao chép mã phòng"; }, 2000);
        }
      };

      const btnCopyMyInvite = document.getElementById("btn-copy-my-invite");
      if (btnCopyMyInvite) btnCopyMyInvite.onclick = () => {
        const codeToCopy = state.currentUser ? state.currentUser.inviteCode : state.coupleGeneratedCode;
        navigator.clipboard.writeText(codeToCopy);
        btnCopyMyInvite.textContent = "Đã sao chép! ✓";
        setTimeout(() => { if (btnCopyMyInvite) btnCopyMyInvite.textContent = "Sao chép mã"; }, 2000);
      };

      const btnDisconnectCouple = document.getElementById("btn-disconnect-couple");
      if (btnDisconnectCouple) btnDisconnectCouple.onclick = () => {
        if (confirm("Bạn có chắc muốn hủy kết đôi hiện tại không?")) {
          const accounts = loadAccounts();
          const myId = state.currentUser ? state.currentUser.id : null;
          const partnerId = state.coupleProfile ? state.coupleProfile.partnerId : null;
          const nowMs = Date.now() + 20;
          accounts.forEach(acc => {
            if (acc.id === myId || (partnerId && acc.id === partnerId) || (myId && acc.partnerId === myId)) {
              delete acc.coupleCode;
              delete acc.partnerId;
              delete acc.partnerName;
              delete acc.matchedAt;
              acc.isMatched = false;
              acc.outgoingRequestTo = null;
              acc.incomingRequests = [];
              acc.updatedAt = nowMs;
            }
          });
          const cleaned = saveAccounts(accounts);
          state.coupleProfile = null;
          try {
            sessionStorage.removeItem(COUPLE_STORAGE_KEY);
            localStorage.removeItem(COUPLE_STORAGE_KEY);
          } catch {}
          syncCurrentUserFromAccounts();
          if (activeRoomEventSource) {
            try { activeRoomEventSource.close(); } catch {}
            activeRoomEventSource = null;
          }
          publishAccountsToCloud(cleaned);
          state.coupleModalOpen = false;
          render();
        }
      };

      const inpCoupleCode = document.getElementById("inp-couple-code");
      if (inpCoupleCode) inpCoupleCode.oninput = (e) => {
        state.coupleCodeInput = e.target.value;
        state.coupleError = "";
        state.coupleSuccess = "";
      };

      document.querySelectorAll(".btn-quick-connect").forEach(btn => {
        btn.onclick = () => {
          const targetId = btn.getAttribute("data-quick-connect-id");
          const accounts = loadAccounts();
          const partnerAcc = accounts.find(a => a.id === targetId);
          if (partnerAcc) {
            sendPairRequestToPartner(partnerAcc);
          }
        };
      });

      document.querySelectorAll(".btn-accept-pair").forEach(btn => {
        btn.onclick = () => {
          const senderId = btn.getAttribute("data-accept-request-id");
          if (senderId) {
            acceptPairRequest(senderId);
          }
        };
      });

      document.querySelectorAll(".btn-decline-pair").forEach(btn => {
        btn.onclick = () => {
          const senderId = btn.getAttribute("data-decline-request-id");
          if (senderId) {
            declinePairRequest(senderId);
          }
        };
      });

      document.querySelectorAll(".btn-cancel-pair-request").forEach(btn => {
        btn.onclick = () => {
          cancelOutgoingPairRequest();
        };
      });

      const coupleForm = document.getElementById("couple-form");
      if (coupleForm) coupleForm.onsubmit = async (e) => {
        e.preventDefault();
        state.coupleError = "";
        state.coupleSuccess = "";
        const inpElem = document.getElementById("inp-couple-code");
        const rawInput = (inpElem ? inpElem.value : state.coupleCodeInput).trim();
        if (!rawInput) {
          state.coupleError = "Vui lòng nhập mã kết đôi hoặc tên đăng nhập của người yêu.";
          render();
          return;
        }
        const cleanUpper = rawInput.replace(/^[@#]/, "").trim().toUpperCase();
        const cleanLower = rawInput.replace(/^[@#]/, "").trim().toLowerCase();

        // Check if the user entered their own code or username
        if (state.currentUser) {
          const myInvite = (state.currentUser.inviteCode || "").toUpperCase();
          const myUser = (state.currentUser.username || "").toLowerCase();
          if (cleanUpper === myInvite || cleanLower === myUser) {
            state.coupleError = "Đây là mã hoặc tài khoản của chính bạn. Hãy nhập mã của người yêu nhé!";
            render();
            return;
          }
        }

        let accounts = loadAccounts();
        let partnerAcc = accounts.find(a =>
          (!state.currentUser || a.id !== state.currentUser.id) &&
          !a.isRemote &&
          !String(a.id).startsWith("remote-") &&
          ((a.inviteCode && a.inviteCode.toUpperCase() === cleanUpper) ||
           (a.username && a.username.toLowerCase() === cleanLower))
        );

        // If not found in local storage yet, pull latest registered accounts from Cloud Registry
        if (!partnerAcc) {
          accounts = await pullCloudAccountsNow();
          partnerAcc = accounts.find(a =>
            (!state.currentUser || a.id !== state.currentUser.id) &&
            !a.isRemote &&
            !String(a.id).startsWith("remote-") &&
            ((a.inviteCode && a.inviteCode.toUpperCase() === cleanUpper) ||
             (a.username && a.username.toLowerCase() === cleanLower))
          );
        }

        // Strict verification: Reject if the user does not exist!
        if (!partnerAcc) {
          state.coupleError = "Không tìm thấy tài khoản người yêu với mã hoặc tên đăng nhập này. Vui lòng kiểm tra lại!";
          render();
          return;
        }

        sendPairRequestToPartner(partnerAcc);
      };

      // Change PIN Modal Handlers
      const btnOpenChangePin = document.getElementById("btn-open-change-pin");
      if (btnOpenChangePin) btnOpenChangePin.onclick = () => {
        state.changePinModalOpen = true;
        state.pinChangeOld = "";
        state.pinChangeNew = "";
        state.pinChangeConfirm = "";
        state.pinChangeError = "";
        state.pinChangeSuccess = false;
        render();
      };

      const btnCloseChangePin = document.getElementById("btn-close-change-pin");
      if (btnCloseChangePin) btnCloseChangePin.onclick = () => { state.changePinModalOpen = false; render(); };

      const btnCancelChangePin = document.getElementById("btn-cancel-change-pin");
      if (btnCancelChangePin) btnCancelChangePin.onclick = () => { state.changePinModalOpen = false; render(); };

      const inpOldPin = document.getElementById("inp-old-pin");
      if (inpOldPin) inpOldPin.oninput = (e) => { state.pinChangeOld = e.target.value; };

      const inpNewPin = document.getElementById("inp-new-pin");
      if (inpNewPin) inpNewPin.oninput = (e) => { state.pinChangeNew = e.target.value; };

      const inpConfirmPin = document.getElementById("inp-confirm-pin");
      if (inpConfirmPin) inpConfirmPin.oninput = (e) => { state.pinChangeConfirm = e.target.value; };

      const changePinForm = document.getElementById("change-pin-form");
      if (changePinForm) changePinForm.onsubmit = (e) => {
        e.preventDefault();
        state.pinChangeError = "";
        const oldPin = state.pinChangeOld.trim();
        const newPin = state.pinChangeNew.trim();
        const confirmPin = state.pinChangeConfirm.trim();

        if (oldPin !== state.adminPin && oldPin !== "2410") {
          state.pinChangeError = "Mã PIN hiện tại chưa chính xác.";
          render();
          return;
        }
        if (newPin.length < 4 || newPin.length > 8) {
          state.pinChangeError = "Mã PIN mới nên có từ 4 đến 8 chữ số.";
          render();
          return;
        }
        if (newPin !== confirmPin) {
          state.pinChangeError = "Mã PIN xác nhận không khớp.";
          render();
          return;
        }

        state.adminPin = newPin;
        localStorage.setItem(CUSTOM_PIN_KEY, newPin);
        broadcastSync("PIN_UPDATED", newPin);
          if (state.coupleProfile && state.coupleProfile.coupleCode) {
            sendCloudMessage(getTopicName("room", state.coupleProfile.coupleCode), {
              type: "PIN_UPDATED",
              senderId: state.currentUser ? state.currentUser.id : undefined,
              payload: newPin
            });
          }
        state.pinChangeSuccess = true;
        render();

        setTimeout(() => {
          state.changePinModalOpen = false;
          render();
        }, 1200);
      };

      // Auth Modal & User Handlers
      const btnOpenAuth = document.getElementById("btn-open-auth");
      if (btnOpenAuth) btnOpenAuth.onclick = () => { state.authModalOpen = true; state.authError = ""; render(); };

      const btnBannerAuth = document.getElementById("btn-banner-auth");
      if (btnBannerAuth) btnBannerAuth.onclick = () => { state.authModalOpen = true; state.authError = ""; render(); };

      const btnBannerCouple = document.getElementById("btn-banner-couple");
      if (btnBannerCouple) btnBannerCouple.onclick = () => {
        state.coupleModalOpen = true;
        state.coupleError = "";
        state.coupleSuccess = "";
        render();
      };

      const btnCloseAuth = document.getElementById("btn-close-auth");
      if (btnCloseAuth) btnCloseAuth.onclick = () => { state.authModalOpen = false; render(); };

      const btnLogout = document.getElementById("btn-logout");
      if (btnLogout) btnLogout.onclick = () => {
        if (activeRoomEventSource) {
          try { activeRoomEventSource.close(); } catch {}
          activeRoomEventSource = null;
        }
        state.currentUser = null;
        state.coupleProfile = null;
        try {
          sessionStorage.setItem(SESSION_LOGOUT_KEY, "true");
          sessionStorage.removeItem(AUTH_USER_KEY);
          sessionStorage.removeItem(COUPLE_STORAGE_KEY);
        } catch {}
        localStorage.removeItem(AUTH_USER_KEY);
        localStorage.removeItem(COUPLE_STORAGE_KEY);
        render();
      };

      const btnAuthTabLogin = document.getElementById("btn-auth-tab-login");
      if (btnAuthTabLogin) btnAuthTabLogin.onclick = () => {
        state.authTab = "login";
        state.authError = "";
        render();
      };

      const btnAuthTabRegister = document.getElementById("btn-auth-tab-register");
      if (btnAuthTabRegister) btnAuthTabRegister.onclick = () => {
        state.authTab = "register";
        state.authError = "";
        render();
      };

      const btnAuthRoleAnh = document.getElementById("btn-auth-role-anh");
      if (btnAuthRoleAnh) btnAuthRoleAnh.onclick = () => { state.authRole = "anh"; render(); };

      const btnAuthRoleEm = document.getElementById("btn-auth-role-em");
      if (btnAuthRoleEm) btnAuthRoleEm.onclick = () => { state.authRole = "em"; render(); };

      const inpAuthUser = document.getElementById("inp-auth-username");
      if (inpAuthUser) inpAuthUser.oninput = (e) => { state.authUsername = e.target.value; };

      const inpAuthPass = document.getElementById("inp-auth-password");
      if (inpAuthPass) inpAuthPass.oninput = (e) => { state.authPassword = e.target.value; };

      const inpAuthNick = document.getElementById("inp-auth-nickname");
      if (inpAuthNick) inpAuthNick.oninput = (e) => { state.authNickname = e.target.value; };

      const authForm = document.getElementById("auth-form");
      if (authForm) authForm.onsubmit = async (e) => {
        e.preventDefault();
        state.authError = "";
        const username = state.authUsername.trim().toLowerCase();
        const password = state.authPassword.trim();
        if (!username || !password) {
          state.authError = "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.";
          render();
          return;
        }

        let accounts = loadAccounts();
        if (state.authTab === "login") {
          let found = accounts.find(a => a.username.toLowerCase() === username && a.password === password);
          if (!found) {
            accounts = await pullCloudAccountsNow();
            found = accounts.find(a => a.username.toLowerCase() === username && (!a.password || a.password === password));
          }
          if (!found) {
            state.authError = "Tên đăng nhập hoặc mật khẩu không chính xác.";
            render();
            return;
          }
          if (!found.inviteCode) {
            found.inviteCode = generateInviteCode(accounts);
            found.updatedAt = Date.now();
            saveAccounts(accounts);
          }
          state.currentUser = found;
          try {
            sessionStorage.removeItem(SESSION_LOGOUT_KEY);
            sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(found));
          } catch {}
          localStorage.setItem(AUTH_USER_KEY, JSON.stringify(found));
          syncCurrentUserFromAccounts();
          publishAccountsToCloud(loadAccounts());
          if (state.coupleProfile && state.coupleProfile.coupleCode) {
            subscribeCloudRoom(state.coupleProfile.coupleCode);
          }
          state.authModalOpen = false;
          state.authPassword = "";
          if (!state.coupleProfile) {
            state.coupleModalOpen = true;
            state.coupleError = "";
            state.coupleSuccess = "";
          }
          render();
        } else {
          // Register
          if (username.length < 3) {
            state.authError = "Tên đăng nhập cần có tối thiểu 3 ký tự.";
            render();
            return;
          }
          if (password.length < 4) {
            state.authError = "Mật khẩu cần có tối thiểu 4 ký tự.";
            render();
            return;
          }
          accounts = await pullCloudAccountsNow();
          if (accounts.some(a => a.username.toLowerCase() === username)) {
            state.authError = "Tên đăng nhập này đã tồn tại. Bạn hãy chọn tên khác nhé.";
            render();
            return;
          }

          const nickname = state.authNickname.trim() || (state.authRole === "anh" ? "Anh" : "Em");
          const newAcc = {
            id: "usr-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7),
            username: username,
            password: password,
            nickname: nickname,
            role: state.authRole,
            inviteCode: generateInviteCode(accounts),
            isMatched: false,
            outgoingRequestTo: null,
            incomingRequests: [],
            updatedAt: Date.now(),
            createdAt: new Date().toISOString()
          };

          accounts.push(newAcc);
          const cleaned = saveAccounts(accounts);
          state.currentUser = newAcc;
          try {
            sessionStorage.removeItem(SESSION_LOGOUT_KEY);
            sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(newAcc));
          } catch {}
          localStorage.setItem(AUTH_USER_KEY, JSON.stringify(newAcc));
          syncCurrentUserFromAccounts();
          publishAccountsToCloud(cleaned);
          state.authModalOpen = false;
          state.authPassword = "";
          state.coupleModalOpen = true;
          state.coupleError = "";
          state.coupleSuccess = "";

          if (window.confetti) confetti({ particleCount: 65, spread: 70, origin: { y: 0.6 } });
          render();
        }
      };
    }

    initSupabaseClient();
    subscribeGlobalCloudRegistry();
    if (state.currentUser && state.coupleProfile && state.coupleProfile.coupleCode) {
      subscribeCloudRoom(state.coupleProfile.coupleCode);
    }
    render();
  </script>
</body>
</html>
